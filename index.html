<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Booking</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Simple Booking</h1>
    <p>Book an appointment in a few seconds.</p>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">Book an appointment</h2>

      <form id="booking-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div class="row">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="field">
            <label for="time">Time slot</label>
            <select id="time" name="time" required>
              <option value="">Select a time</option>
            </select>
          </div>
        </div>

        <p id="form-message" class="message" role="status" aria-live="polite"></p>

        <button type="submit" class="btn btn-primary">Book appointment</button>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-header">
        <h2 id="list-title">Bookings</h2>
        <span id="booking-count" class="badge">0</span>
      </div>

      <p id="empty-state" class="empty">No bookings yet.</p>
      <ul id="booking-list" class="booking-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
